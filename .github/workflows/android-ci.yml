name: Android PR Check

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  verify:
    name: Compile & Verify PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore stable repository signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore ]; then
            echo "Using checked-in debug.keystore"
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          SOURCE_LABEL=""
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            TRIMMED="$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed 's/^[[:space:]]*//')"
            if printf '%s' "$TRIMMED" | grep -q '^{'; then
              echo "Restoring app/google-services.json from raw GOOGLE_SERVICES_JSON secret"
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "Decoding base64 GOOGLE_SERVICES_JSON secret into app/google-services.json"
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n ' | base64 -d > app/google-services.json
            fi
            SOURCE_LABEL="GOOGLE_SERVICES_JSON secret"
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Decoding GOOGLE_SERVICES_JSON_BASE64 secret into app/google-services.json"
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json
            SOURCE_LABEL="GOOGLE_SERVICES_JSON_BASE64 secret"
          elif [ -f app/google-services.json ]; then
            echo "Using checked-in app/google-services.json"
            SOURCE_LABEL="checked-in app/google-services.json"
          else
            echo "::error::app/google-services.json is missing (AI Studio omits google-services.json when pushing to GitHub). Add repository secret GOOGLE_SERVICES_JSON in GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          python3 - "$SOURCE_LABEL" <<'PY'
          import json, sys
          source = sys.argv[1]
          try:
              with open("app/google-services.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              print(f"::error::app/google-services.json ({source}) is not valid JSON: {exc}")
              sys.exit(1)
          project_id = data.get("project_info", {}).get("project_id", "<unknown>")
          pkgs = [
              c.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
              for c in data.get("client", [])
          ]
          print(f"Firebase config loaded from {source} (project_id={project_id}, clients={pkgs})")
          if "com.gullzubair.sarim" not in pkgs:
              print(
                  f"::error::app/google-services.json from {source} has clients {pkgs} (project_id={project_id}), "
                  "but applicationId requires 'com.gullzubair.sarim'. Update your GitHub Actions secret "
                  "GOOGLE_SERVICES_JSON (or GOOGLE_SERVICES_JSON_BASE64) with the new google-services.json."
              )
              sys.exit(1)
          PY

      - name: Compile Kotlin, Build Debug APK & Run Tests
        run: gradle :app:compileDebugKotlin assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Upload PR Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarim-pr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
